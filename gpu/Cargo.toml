[package]
name = "globalsim-gpu"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Spike: OpenCL port of the GlobalSim restricted flat no-skills loop vs a 20-thread Rust baseline"

# The engine package root must stay a single package (the app's globalsim-wasm
# depends on it by path), so this crate keeps its own empty workspace root.
[workspace]

[features]
default = []
# OpenCL host, kernel, correctness gate and bench. Needs OpenCL.lib on LIB.
gpu = ["dep:ocl"]

[dependencies]
ocl = { version = "=0.19.7", optional = true }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["gpu"]
