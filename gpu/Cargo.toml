[package]
name = "globalsim-gpu"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Spike: OpenCL port of the GlobalSim restricted flat no-skills loop vs a 20-thread Rust baseline"

# The engine package root must stay a single package (the app's globalsim-wasm
# depends on it by path), so this crate keeps its own empty workspace root.
[workspace]

[features]
default = []
# OpenCL host, kernel, correctness gate and bench. Needs OpenCL.lib on LIB.
gpu = ["dep:ocl"]
# Engine course-geometry runtime (handoff step 6, geometry slice) and its
# kernel host. Gated out of the lib's test target, see src/lib.rs.
geometry = []
# Retail initialization chain (handoff step 6, initialization slice): the
# vendored retail_initialization host and its kernel. Gated out of the lib's
# test target, see src/lib.rs.
initialization = []
# Whole-race no-skill kernel host (handoff step 6, race slice). Needs the
# initialization and geometry hosts plus the device. Gated out of the lib's
# test target, see src/lib.rs.
race = ["gpu", "initialization", "geometry"]

[dependencies]
ocl = { version = "=0.19.7", optional = true }
# The full engine as a library for the whole-race comparison tool. Path dep
# only, no copy. default-features off keeps mimalloc and its C toolchain out.
# external-geometry lets the tool register course geometry like the wasm host.
globalsim = { package = "race_engine_rs", path = "..", default-features = false, features = ["external-geometry"] }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["gpu"]

[[bin]]
name = "gpu-race-diff"
path = "src/bin/gpu_race_diff.rs"
